name: Build

on:
  push:
    branches: [main]
  pull_request:

# Compile-only matrix — same workflow for Linux and macOS (one codebase).
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake \
            libglfw3-dev libglew-dev libglm-dev \
            libcurl4-openssl-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            nlohmann-json3-dev \
            libsqlite3-dev \
            libgl1-mesa-dev \
            zenity

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake glfw glew glm curl ffmpeg nlohmann-json sqlite pkg-config

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
